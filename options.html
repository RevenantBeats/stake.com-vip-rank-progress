<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Rank Progress - Options</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .setting {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid #eee;
        }
        
        .setting:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .setting-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        
        .toggle {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
            margin-right: 15px;
        }
        
        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle input:checked + .slider {
            background-color: #667eea;
        }
        
        .toggle input:checked + .slider:before {
            transform: translateX(22px);
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 28px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        
        .setting-text {
            flex: 1;
        }
        
        .setting-title {
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .setting-description {
            color: #999;
            font-size: 13px;
            line-height: 1.4;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .save-btn {
            background-color: #667eea;
            color: white;
        }
        
        .save-btn:hover {
            background-color: #5568d3;
        }
        
        .reset-btn {
            background-color: #f0f0f0;
            color: #333;
        }
        
        .reset-btn:hover {
            background-color: #e0e0e0;
        }
        
        .status-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }
        
        .status-message.success {
            background-color: #d4edda;
            color: #155724;
            display: block;
        }
        
        .status-message.error {
            background-color: #f8d7da;
            color: #721c24;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>VIP Rank Progress</h1>
        <p class="subtitle">Configure extension settings</p>
        
        <div class="setting">
            <label class="setting-label">
                <label class="toggle">
                    <input type="checkbox" id="autoClaimToggle">
                    <span class="slider"></span>
                </label>
                <div class="setting-text">
                    <div class="setting-title">Auto-Claim Reloads</div>
                    <div class="setting-description">Automatically click the "Claim Reload" button every 5 seconds when available</div>
                </div>
            </label>
        </div>
        
        <div class="button-group">
            <button class="save-btn" id="saveBtn">Save Settings</button>
            <button class="reset-btn" id="resetBtn">Reset to Default</button>
        </div>
        
        <div class="status-message" id="statusMessage"></div>
    </div>

    <script src="js/options.js"></script>
</body>
</html>
